name: Test
on:
  workflow_call:
  push:
    paths:
      - 'src/**'
      - 'paket.lock'
      - 'global.json'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'paket.lock'
      - 'global.json'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
          os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
          include:
            - os: ubuntu-latest
              run-build: sh ./build.sh Release
            - os: windows-latest
              run-build: .\build.cmd Release
            - os: macos-latest
              run-build: bash ./build.sh Release
            - os: macos-15-intel
              run-build: bash ./build.sh Release

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Dotnet
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore NuGet cache
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/paket.lock') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Build
      run: ${{ matrix.run-build }}

    - name: Test
      run: dotnet run -c Release --no-build --project ./src/Tests/Aardvark.Rendering.Tests/Aardvark.Rendering.Tests.fsproj --cpu-only